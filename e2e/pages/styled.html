<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Styled inputs</title>
        <style>
            #dark-input {
                background-color: rgb(38, 50, 56);
                border: 2px solid rgb(255, 152, 0);
                border-radius: 8px;
                color: rgb(245, 245, 245);
                width: 310px;
            }

            #light-input {
                background-color: rgb(255, 243, 224);
                border: 3px dashed rgb(121, 85, 72);
                border-radius: 14px;
                color: rgb(78, 52, 46);
                width: 240px;
            }
        </style>
    </head>
    <body>
        <label for="dark-input">Dark input</label>
        <input id="dark-input" type="text">

        <label for="light-input">Light input</label>
        <input id="light-input" type="text">
    </body>
</html>
